<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem('visora-theme'); } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <style>html { background: #fff; } html.dark { background: #0f0f14; }</style>
    <link rel="icon" type="image/svg+xml" href="/src/assets/shared/branding/HeadingLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
